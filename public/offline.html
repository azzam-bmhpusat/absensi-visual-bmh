<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#095046" />
  <title>Offline | Rakernas BMH</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #095046; text-align: center;
    }
    main { max-width: 360px; }
    img { width: 220px; max-width: 100%; height: auto; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: #3d5c55; line-height: 1.5; }
    button {
      min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px;
      background: #095046; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #FEB738; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo-rakernas-nav.png" alt="Logo Rakernas BMH 2027" />
    <h1>Anda sedang offline</h1>
    <p>Periksa koneksi internet Anda, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
