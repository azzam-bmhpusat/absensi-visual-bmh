<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A3A30">
  <title>Hero 01 — Elegan | Rakernas BMH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap"
    rel="stylesheet">
  <style>
    /* Mandiri: salin section dan CSS berawalan bmh-elegan untuk integrasi. */
    body {
      margin: 0;
    }

    .bmh-elegan {
      --bmh-night: #0A3A30;
      --bmh-deep: #095046;
      --bmh-green: #39BA87;
      --bmh-gold: #F2D06B;
      --bmh-white: #FFFFFF;
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 64px 32px;
      background: var(--bmh-night);
      color: var(--bmh-white);
      font: 400 16px/1.6 "Inter", Arial, sans-serif;
    }

    .bmh-elegan *,
    .bmh-elegan *::before,
    .bmh-elegan *::after {
      box-sizing: border-box;
    }

    .bmh-elegan::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 760px;
      height: 760px;
      right: -310px;
      top: -390px;
      border: 1px solid rgb(242 208 107 / 20%);
      border-radius: 50%;
      box-shadow: 0 0 0 86px rgb(242 208 107 / 3%), 0 0 0 172px rgb(242 208 107 / 3%);
      pointer-events: none;
    }

    .bmh-elegan__wrap {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    .bmh-elegan__eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 44px;
      color: var(--bmh-gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .bmh-elegan__eyebrow::before {
      content: "";
      width: 32px;
      height: 2px;
      background: currentColor;
      flex-shrink: 0;
    }

    .bmh-elegan__grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(32px, 5vw, 80px);
    }

    .bmh-elegan__title {
      margin: 0;
      max-width: 720px;
      font: 600 clamp(44px, 5.15vw, 74px)/1.12 "Poppins", Arial, sans-serif;
      letter-spacing: -.055em;
    }

    .bmh-elegan__title span {
      display: block;
      color: var(--bmh-gold);
    }

    .bmh-elegan__theme {
      max-width: 540px;
      margin: 28px 0 0;
      padding-left: 20px;
      border-left: 2px solid var(--bmh-green);
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.8;
      color: #D5F5E6;
    }

    .bmh-elegan__panel {
      position: relative;
      border: 1px solid rgb(242 208 107 / 35%);
      border-radius: 24px;
      padding: clamp(24px, 3vw, 40px);
      background: var(--bmh-deep);
      box-shadow: 0 24px 64px rgb(10 58 48 / 25%);
    }

    .bmh-elegan__label {
      margin: 0 0 16px;
      color: #D5F5E6;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .bmh-elegan__date {
      display: block;
    }

    .bmh-elegan__days {
      display: block;
      color: var(--bmh-gold);
      font: 600 clamp(54px, 5.3vw, 76px)/1.1 "Poppins", Arial, sans-serif;
      letter-spacing: -.06em;
      white-space: nowrap;
    }

    .bmh-elegan__month {
      display: block;
      margin-top: 8px;
      font-size: 19px;
      font-weight: 500;
    }

    .bmh-elegan__venue {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid rgb(255 255 255 / 18%);
    }

    .bmh-elegan__hotel {
      margin: 0;
      font: 600 20px/1.5 "Poppins", Arial, sans-serif;
    }

    .bmh-elegan__city {
      margin: 4px 0 24px;
      color: #D5F5E6;
      font-size: 14px;
    }

    .bmh-elegan__button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: 14px;
      background: var(--bmh-gold);
      color: var(--bmh-night);
      text-decoration: none;
      font-weight: 600;
      transition: background-color .2s ease;
    }

    .bmh-elegan__button:hover {
      background: #F8E08F;
    }

    .bmh-elegan__button:focus-visible {
      outline: 3px solid var(--bmh-white);
      outline-offset: 5px;
    }

    .bmh-elegan__button svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .bmh-elegan__foot {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 48px 0 0;
      color: #D5F5E6;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .bmh-elegan__foot::before {
      content: "";
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bmh-green);
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .bmh-elegan {
        padding: 48px 24px;
      }

      .bmh-elegan__grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 36px;
      }

      .bmh-elegan__eyebrow {
        margin-bottom: 28px;
      }

      .bmh-elegan__panel {
        width: 100%;
        max-width: 560px;
      }

      .bmh-elegan__title {
        font-size: clamp(42px, 7vw, 64px);
      }

      .bmh-elegan__foot {
        margin-top: 32px;
      }
    }

    @media (max-width: 480px) {
      .bmh-elegan {
        padding: 36px 20px;
      }

      .bmh-elegan__eyebrow {
        font-size: 10px;
        letter-spacing: .14em;
        gap: 10px;
      }

      .bmh-elegan__title {
        font-size: clamp(36px, 10.5vw, 48px);
      }

      .bmh-elegan__theme {
        margin-top: 24px;
        padding-left: 16px;
      }

      .bmh-elegan__panel {
        padding: 24px;
      }

      .bmh-elegan__days {
        font-size: 60px;
      }

      .bmh-elegan__hotel {
        font-size: 18px;
      }

      .bmh-elegan__foot {
        font-size: 10px;
        letter-spacing: .08em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bmh-elegan__button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <section class="bmh-elegan" aria-labelledby="bmh-elegan-title">
    <div class="bmh-elegan__wrap">
      <p class="bmh-elegan__eyebrow">Rapat Kerja Nasional · BMH</p>
      <div class="bmh-elegan__grid">
        <div>
          <h1 id="bmh-elegan-title" class="bmh-elegan__title">Rapat Kerja<br>Nasional <span>BMH 2027</span></h1>
          <p class="bmh-elegan__theme">"Tema Acara"</p>
        </div>
        <div class="bmh-elegan__panel">
          <p class="bmh-elegan__label">Waktu &amp; tempat</p>
          <div class="bmh-elegan__date" aria-label="01–03 Desember 2026">
            <span class="bmh-elegan__days">01–03</span>
            <span class="bmh-elegan__month">Desember 2026</span>
          </div>
          <div class="bmh-elegan__venue">
            <p class="bmh-elegan__hotel">Hotel Grasia Semarang</p>
            <p class="bmh-elegan__city">Semarang, Jawa Tengah</p>
            <a class="bmh-elegan__button" href="https://maps.app.goo.gl/UYtvHFrQZcqtyauX6" target="_blank"
              rel="noopener noreferrer" aria-label="Lihat lokasi Hotel Grasia Semarang di Google Maps (tab baru)">
              Lihat lokasi acara
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M7 17 17 7M7 7h10v10" />
              </svg>
            </a>
          </div>
        </div>
      </div>
      <p class="bmh-elegan__foot">Rakernas BMH 2027 · Semarang</p>
    </div>
  </section>
</body>

</html>
