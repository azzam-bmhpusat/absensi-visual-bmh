<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#134B40">
  <title>Hero 03 — Editorial | Rakernas BMH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    /* Mandiri: salin section dan CSS berawalan bmh-editorial untuk integrasi. */
    body { margin: 0; }
    .bmh-editorial {
      --bmh-deep: #134B40;
      --bmh-night: #0A3A30;
      --bmh-gold: #F2D06B;
      --bmh-white: #FFFFFF;
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      background: #F4F8F6;
      color: var(--bmh-deep);
      font: 400 16px/1.6 "Inter", Arial, sans-serif;
    }
    .bmh-editorial *, .bmh-editorial *::before, .bmh-editorial *::after { box-sizing: border-box; }
    .bmh-editorial__main { display: flex; flex-direction: column; justify-content: center; padding: 64px clamp(32px, 5.5vw, 88px); }
    .bmh-editorial__eyebrow { display: flex; gap: 12px; align-items: center; margin: 0 0 40px; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .bmh-editorial__eyebrow::before { content: ""; width: 28px; height: 3px; flex-shrink: 0; background: #D9A93A; }
    .bmh-editorial__title { margin: 0; font: 600 clamp(44px, 4.9vw, 70px)/1.13 "Poppins", Arial, sans-serif; letter-spacing: -.055em; }
    .bmh-editorial__title span { display: block; }
    .bmh-editorial__title .bmh-editorial__title-year { display: inline; color: #8A6A1F; }
    .bmh-editorial__theme { max-width: 520px; margin: 28px 0 0; font-size: 17px; color: #5B6F68; line-height: 1.8; }
    .bmh-editorial__button {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 52px;
      margin-top: 32px;
      padding: 14px 22px;
      border-radius: 14px;
      background: var(--bmh-deep);
      color: var(--bmh-white);
      font-weight: 600;
      text-decoration: none;
      transition: background-color .2s ease;
    }
    .bmh-editorial__button:hover { background: var(--bmh-night); }
    .bmh-editorial__button:focus-visible { outline: 3px solid var(--bmh-deep); outline-offset: 5px; }
    .bmh-editorial__button svg { width: 20px; height: 20px; flex-shrink: 0; }
    .bmh-editorial__poster { display: flex; flex-direction: column; min-width: 0; background: var(--bmh-deep); color: var(--bmh-white); }
    .bmh-editorial__art {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      min-height: 410px;
      padding: 40px clamp(24px, 3.4vw, 56px);
    }
    .bmh-editorial__art::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 410px;
      height: 410px;
      right: -210px;
      top: -210px;
      border-radius: 50%;
      border: 1px solid rgb(242 208 107 / 40%);
      box-shadow: 0 0 0 42px rgb(242 208 107 / 5%), 0 0 0 84px rgb(242 208 107 / 5%);
      pointer-events: none;
    }
    .bmh-editorial__edition { margin: 0; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #D5F5E6; }
    .bmh-editorial__year { margin: 36px 0; color: var(--bmh-gold); font: 600 clamp(100px, 11.5vw, 184px)/.95 "Poppins", Arial, sans-serif; letter-spacing: -.075em; }
    .bmh-editorial__year span { display: block; }
    .bmh-editorial__art-caption { display: flex; align-items: center; gap: 16px; margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; }
    .bmh-editorial__art-caption::after { content: ""; height: 1px; background: rgb(255 255 255 / 35%); flex: 1; }
    .bmh-editorial__info { padding: 28px clamp(24px, 3.4vw, 56px) 32px; background: var(--bmh-gold); color: var(--bmh-night); }
    .bmh-editorial__label { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .bmh-editorial__date { display: block; font: 600 clamp(28px, 2.7vw, 40px)/1.2 "Poppins", Arial, sans-serif; letter-spacing: -.04em; }
    .bmh-editorial__month { display: block; margin-top: 4px; font-size: 16px; font-weight: 500; }
    .bmh-editorial__hotel { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid rgb(10 58 48 / 25%); font-size: 15px; font-weight: 600; }
    @media (min-width: 1600px) { .bmh-editorial__main { padding-left: max(88px, calc((100vw - 1424px) / 2)); } }
    @media (max-width: 1000px) {
      .bmh-editorial__main { padding: 48px 28px; }
      .bmh-editorial__title { font-size: 44px; }
      .bmh-editorial__theme { font-size: 16px; }
      .bmh-editorial__art { padding: 32px 24px; }
      .bmh-editorial__info { padding: 24px; }
    }
    @media (max-width: 700px) {
      .bmh-editorial { grid-template-columns: minmax(0, 1fr); }
      .bmh-editorial__main { padding: 40px 20px 36px; }
      .bmh-editorial__eyebrow { margin-bottom: 28px; font-size: 10px; letter-spacing: .13em; }
      .bmh-editorial__title { font-size: clamp(38px, 10vw, 58px); }
      .bmh-editorial__theme { margin-top: 24px; }
      .bmh-editorial__button { width: 100%; margin-top: 24px; }
      .bmh-editorial__art { min-height: auto; padding: 24px 20px; gap: 16px; }
      .bmh-editorial__art::before { display: none; }
      .bmh-editorial__year { margin: 0; font-size: clamp(72px, 22vw, 136px); line-height: 1; }
      .bmh-editorial__year span { display: inline; }
      .bmh-editorial__art-caption { display: none; }
      .bmh-editorial__info { padding: 24px 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .bmh-editorial__button { transition: none; } }
  </style>
</head>
<body>
  <section class="bmh-editorial" aria-labelledby="bmh-editorial-title">
    <div class="bmh-editorial__main">
      <p class="bmh-editorial__eyebrow">Rakernas BMH · Semarang</p>
      <h1 class="bmh-editorial__title" id="bmh-editorial-title">Rapat Kerja <span>Nasional</span><span>BMH <span class="bmh-editorial__title-year">2027</span></span></h1>
      <p class="bmh-editorial__theme">Konsolidasi Jati Diri dan Transformasi Organisasi Menuju Hidayatullah Mandiri dan Berpengaruh</p>
      <a class="bmh-editorial__button" href="https://maps.app.goo.gl/UYtvHFrQZcqtyauX6" target="_blank" rel="noopener noreferrer" aria-label="Lihat lokasi Hotel Grasia Semarang di Google Maps (tab baru)">
        Lihat lokasi acara
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
    </div>
    <div class="bmh-editorial__poster">
      <div class="bmh-editorial__art" aria-hidden="true">
        <p class="bmh-editorial__edition">Rapat Kerja Nasional BMH</p>
        <p class="bmh-editorial__year"><span>20</span><span>27</span></p>
        <p class="bmh-editorial__art-caption">Semarang · Jawa Tengah</p>
      </div>
      <div class="bmh-editorial__info">
        <p class="bmh-editorial__label">Catat tanggalnya</p>
        <div aria-label="01–03 Desember 2026"><span class="bmh-editorial__date">01–03</span><span class="bmh-editorial__month">Desember 2026</span></div>
        <p class="bmh-editorial__hotel">Hotel Grasia Semarang</p>
      </div>
    </div>
  </section>
</body>
</html>
