<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#EEFBF5">
  <title>Hero 02 — Minimalis | Rakernas BMH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap"
    rel="stylesheet">
  <style>
    /* Mandiri: salin section dan CSS berawalan bmh-minimalis untuk integrasi. */
    body {
      margin: 0;
    }

    .bmh-minimalis {
      --bmh-deep: #095046;
      --bmh-night: #0A3A30;
      --bmh-gold: #F2D06B;
      --bmh-line: #DDE7E2;
      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      min-height: 100svh;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 64px 32px;
      color: var(--bmh-deep);
      background: linear-gradient(180deg, #FFFFFF 0%, #EEFBF5 100%);
      font: 400 16px/1.6 "Inter", Arial, sans-serif;
      text-align: center;
    }

    .bmh-minimalis *,
    .bmh-minimalis *::before,
    .bmh-minimalis *::after {
      box-sizing: border-box;
    }

    .bmh-minimalis::before,
    .bmh-minimalis::after {
      content: "";
      box-sizing: border-box;
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    .bmh-minimalis::before {
      top: -260px;
      left: -240px;
      border: 70px solid #D5F5E6;
    }

    .bmh-minimalis::after {
      bottom: -340px;
      right: -230px;
      border: 60px solid #FDEFBF;
    }

    .bmh-minimalis__wrap {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .bmh-minimalis__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 28px;
      padding: 8px 16px;
      border: 1px solid var(--bmh-line);
      border-radius: 999px;
      background: #FFFFFF;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .bmh-minimalis__eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #25805F;
    }

    .bmh-minimalis__title {
      margin: 0;
      font: 600 clamp(44px, 5.6vw, 78px)/1.14 "Poppins", Arial, sans-serif;
      letter-spacing: -.055em;
    }

    .bmh-minimalis__title span {
      display: block;
    }

    .bmh-minimalis__year {
      position: relative;
      display: inline-block;
      isolation: isolate;
      font-style: normal;
      white-space: nowrap;
    }

    .bmh-minimalis__year::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: .2em;
      bottom: .08em;
      background: var(--bmh-gold);
      z-index: -1;
    }

    .bmh-minimalis__theme {
      max-width: 700px;
      margin: 28px auto 0;
      font-size: clamp(16px, 1.55vw, 20px);
      line-height: 1.8;
      color: #5B6F68;
    }

    .bmh-minimalis__details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 800px;
      margin: 40px auto 0;
      padding: 24px 0;
      border-top: 1px solid var(--bmh-line);
      border-bottom: 1px solid var(--bmh-line);
      text-align: left;
    }

    .bmh-minimalis__detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 4px 24px;
      min-width: 0;
    }

    .bmh-minimalis__detail+.bmh-minimalis__detail {
      border-left: 1px solid var(--bmh-line);
    }

    .bmh-minimalis__icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #D5F5E6;
      flex-shrink: 0;
    }

    .bmh-minimalis__icon svg {
      width: 22px;
      height: 22px;
    }

    .bmh-minimalis__label {
      display: block;
      margin: 0 0 3px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #5B6F68;
    }

    .bmh-minimalis__value {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .bmh-minimalis__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      margin-top: 32px;
      padding: 14px 24px;
      border-radius: 14px;
      background: var(--bmh-deep);
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
      transition: background-color .2s ease;
    }

    .bmh-minimalis__button:hover {
      background: var(--bmh-night);
    }

    .bmh-minimalis__button:focus-visible {
      outline: 3px solid var(--bmh-deep);
      outline-offset: 5px;
    }

    .bmh-minimalis__button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @media (max-width: 800px) {
      .bmh-minimalis {
        padding: 56px 24px;
      }

      .bmh-minimalis__detail {
        gap: 12px;
        padding: 4px 16px;
      }
    }

    @media (max-width: 600px) {
      .bmh-minimalis {
        padding: 44px 20px;
      }

      .bmh-minimalis__eyebrow {
        font-size: 10px;
        letter-spacing: .12em;
        margin-bottom: 28px;
      }

      .bmh-minimalis__title {
        font-size: clamp(34px, 9vw, 50px);
      }

      .bmh-minimalis__theme {
        margin-top: 24px;
        font-size: 16px;
      }

      .bmh-minimalis__details {
        grid-template-columns: minmax(0, 1fr);
        margin-top: 28px;
        padding: 0;
      }

      .bmh-minimalis__detail {
        justify-content: flex-start;
        padding: 20px 0;
        gap: 16px;
      }

      .bmh-minimalis__detail+.bmh-minimalis__detail {
        border-left: 0;
        border-top: 1px solid var(--bmh-line);
      }

      .bmh-minimalis__button {
        width: 100%;
        margin-top: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bmh-minimalis__button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <section class="bmh-minimalis" aria-labelledby="bmh-minimalis-title">
    <div class="bmh-minimalis__wrap">
      <p class="bmh-minimalis__eyebrow">Rakernas BMH · Semarang</p>
      <h1 class="bmh-minimalis__title" id="bmh-minimalis-title">Rapat Kerja Nasional <span>BMH <em
            class="bmh-minimalis__year">2027</em></span></h1>
      <p class="bmh-minimalis__theme">"Tema Acara"</p>
      <div class="bmh-minimalis__details">
        <div class="bmh-minimalis__detail">
          <span class="bmh-minimalis__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="3" />
              <path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2" />
            </svg></span>
          <div><span class="bmh-minimalis__label">Tanggal acara</span>
            <p class="bmh-minimalis__value">01–03 Desember 2026</p>
          </div>
        </div>
        <div class="bmh-minimalis__detail">
          <span class="bmh-minimalis__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg></span>
          <div><span class="bmh-minimalis__label">Lokasi acara</span>
            <p class="bmh-minimalis__value">Hotel Grasia Semarang</p>
          </div>
        </div>
      </div>
      <a class="bmh-minimalis__button" href="https://maps.app.goo.gl/UYtvHFrQZcqtyauX6" target="_blank"
        rel="noopener noreferrer" aria-label="Lihat lokasi Hotel Grasia Semarang di Google Maps (tab baru)">
        Lihat lokasi acara
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M7 7h10v10" />
        </svg>
      </a>
    </div>
  </section>
</body>

</html>
